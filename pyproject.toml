[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "google-photos-picker"
dynamic = ["version"]
description = "Python client for the Google Photos Picker API – sessions, polling, downloads, sync & async, plus a one-command CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Orcai LLC" }]
keywords = ["google photos", "photos picker", "picker api", "google photos api", "oauth"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
qr = ["qrcode>=7"]
google-auth = ["google-auth>=2.20", "requests>=2"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff", "mypy"]

[project.scripts]
google-photos-picker = "google_photos_picker.cli:main"

[project.urls]
Documentation = "https://developers.google.com/photos/picker"

[tool.hatch.version]
path = "src/google_photos_picker/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/google_photos_picker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
warn_return_any = false
